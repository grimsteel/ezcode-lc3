<!DOCTYPE html>
<html>
  <head>
    <title>EZCode Compiler</title>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8">
    <script type="text/javascript" charset="utf-8" src="wasm-gc/app.wasm-runtime.js"></script>
    <script>
      async function main() {
        let teavm = await TeaVM.wasmGC.load("wasm-gc/app.wasm");
        teavm.exports.main([]);
      }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css">
    
  </head>
  <style>
    html, body {
      height: 100vh;
      margin-top: 0;
      margin-bottom: 0;
    }
    body {
      display: flex;
      flex-direction: column;
      margin: 0 4rem;
      max-width: unset;
    }
    #log-section, #main-section {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      min-height: 0;
    }
    #main-section {
      flex-shrink: 0;
    }
    #ezcode-form, #download-section, #log-section {
      flex-grow: 1;
    }

    #log-section > div {
      display: flex;
      flex-direction : column;
      flex: 1 1 0px;
    }

    pre {
      min-height: 0;
      overflow-wrap:break-word;
      white-space: pre-wrap;
      min-width: 0;
      flex-grow: 1;
      overflow: auto;
    }
  </style>
  <body onload="main()">
    <div id="main-section">
      <form id="ezcode-form">
        <h3>Enter source:</h3>
        <textarea id="ezcode-source" rows="10" required>
print("Factorial calculator. Enter a number:");
n = input();
result = 1;
i = 1;
while (i <= n) {
    result = result * i;
    i = i + 1;
}
print(n, " factorial is ", result);
        </textarea>

        <button type="submit">Compile</button>
        <button type="button" id="file-upload-btn">Upload File</button>
      </form>

      <input type="file" id="file-upload" style="display: none" />

      <div id="download-section">
        <h3>Compiled <code>.obj</code>:</h3>
        <p>Compiled file size: <span id="filesize">N/A</span> kb</p>
        <input type="text" id="out-filename" placeholder="Output filename" />
        <p>Compiled <code>.obj</code> files can be loaded into LC3Tools from the simulator tab.</p>
        <button type="button" id="download-button">Download</button>
      </div>
    </div>

    <div id="log-section">
      <div>
        <h3>Lexer</h3>
        <pre id="lexer-log"></pre>
      </div>
      <div>
        <h3>Parser</h3>
        <pre id="parser-log"></pre>
      </div>
      <div>
        <h3>Codegen</h3>
        <pre id="codegen-log"></pre>
      </div>
    </div>
    <a style="visibility: hidden" id="download-link"></a>
    <script>
      const ezcodeSource = document.getElementById("ezcode-source");
      const fileUploadBtn = document.getElementById("file-upload-btn");
      const fileUpload = document.getElementById("file-upload");
      const downloadSection = document.getElementById("download-section");
      const filesizeSpan = document.getElementById("filesize");
      const outFilename = document.getElementById("out-filename");
      const downloadButton = document.getElementById("download-button");
      const downloadLink = document.getElementById("download-link");

      let compiled = null;

      fileUploadBtn.addEventListener("click", () => {
        fileUpload.click();
      });
      fileUpload.addEventListener("change", () => {
        if (fileUpload.files.length > 0) {
          const file = fileUpload.files[0];
          // insert contents
          const reader = new FileReader();
          reader.onload = () => {
            ezcodeSource.value = reader.result;
          };
          reader.readAsText(file);
          // update output name
          outFilename.value = file.name.replace(/\.[^/.]+$/, "") + ".obj";
        }
      });
      
      /**
      * @param {Int8Array} bytes
      */
      function downloadObj(bytes) {
        compiled = new Uint8Array(bytes);
        filesizeSpan.innerText = Math.round(compiled.length / 1000);
      }

      downloadButton.addEventListener("click", () => {
        if (!compiled) return alert("Compile a file first!");
        const name = outFilename.value || "program.obj";
        const fileBlob = new File([compiled], name, { type: "application/octet-stream" });
        const url = URL.createObjectURL(fileBlob);
        // download
        downloadLink.href = url;
        downloadLink.click();
        URL.revokeObjectURL(url);
      });
    </script>
  </body>
</html>
